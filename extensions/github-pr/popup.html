<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub PR Creator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>GitHub PR Creator</h1>
      <p>Create PRs fast. Token is never stored.</p>
    </header>

    <section class="section">
      <label>Repository (owner/repo)</label>
      <input id="repo" type="text" placeholder="playauto/your-repo" />

      <div class="grid">
        <div>
          <label>Base (target)</label>
          <input id="base" list="branches" type="text" placeholder="main" />
        </div>
        <div>
          <label>Head (source)</label>
          <input id="head" list="branches" type="text" placeholder="feature/branch" />
        </div>
      </div>

      <label>GitHub Access Token (PAT)</label>
      <input id="token" type="password" placeholder="ghp_... (not saved)" />

      <button id="loadBranches" class="secondary">Load Branches</button>
      <datalist id="branches"></datalist>
    </section>

    <section class="section">
      <div class="section-title">PR Template Agent</div>
      <label>Jira URL (optional)</label>
      <input id="jiraUrl" type="text" placeholder="https://jira.example.com/browse/ABC-123" />
      <p class="hint">Title/body are generated automatically on Create PR.</p>
    </section>

    <section class="section">
      <label class="checkbox">
        <input id="draft" type="checkbox" />
        Draft PR
      </label>
    </section>

    <div class="actions">
      <button id="create" class="primary">Create PR</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
